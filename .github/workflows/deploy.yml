name: Deploy Backend Juridico

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build com Maven
        run: mvn clean package -DskipTests
        working-directory: ./sistema

      - name: Copiar .jar para a VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "sistema/target/*.jar"
          target: "/opt/sistema-juridico/upload/"
          strip_components: 2

      - name: Atualizar app.jar e reiniciar serviço
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mv -f /opt/sistema-juridico/upload/*.jar /opt/sistema-juridico/app.jar
            rm -rf /opt/sistema-juridico/upload
            sudo systemctl restart sistema-juridico.service
